{% extends 'base.html' %}

<div class="container py-5 text-center" style="min-height:60vh;display:flex;align-items:center;justify-content:center;">
  <div>
    <div style="font-family:var(--font-serif);font-size:8rem;font-weight:800;color:rgba(231,76,60,0.1);line-height:1;">500</div>
